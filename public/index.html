<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Foods - Student POC</title>
  <!-- Simple styling so the table is easy to read -->
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 6px 12px; text-align: left; }
    th { background: #eee; }
    .disclaimer { margin-top: 2rem; font-size: 0.85rem; color: #555; }
  </style>
</head>
<body>
  <h1>Food Items</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
      </tr>
    </thead>
    <!-- JavaScript adds the rows here -->
    <tbody id="foods-body"></tbody>
  </table>

  <p class="disclaimer">
    Disclaimer: this application is student work and is for demonstrating
    web development skills only.
  </p>

  <script>
    // Ask the server for the foods
    fetch("/foods")
      .then(function (response) {
        // turn the response into a JavaScript array
        return response.json();
      })
      .then(function (foods) {
        const tbody = document.getElementById("foods-body");

        // make one table row for each food
        for (let i = 0; i < foods.length; i++) {
          const row = document.createElement("tr");

          const idCell = document.createElement("td");
          idCell.textContent = foods[i].id;

          const nameCell = document.createElement("td");
          nameCell.textContent = foods[i].name;

          const priceCell = document.createElement("td");
          priceCell.textContent = "$" + foods[i].price.toFixed(2);

          // put the cells in the row, then the row in the table
          row.appendChild(idCell);
          row.appendChild(nameCell);
          row.appendChild(priceCell);
          tbody.appendChild(row);
        }
      })
      .catch(function (error) {
        console.log("Could not load foods: " + error);
      });
  </script>
</body>
</html>
